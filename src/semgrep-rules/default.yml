rules:
  - id: ai-toolkit-no-dynamic-code-execution
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: Do not evaluate dynamically constructed JavaScript or TypeScript code
    metadata:
      category: security
      technology:
        - javascript
        - typescript
      confidence: HIGH
      scope: generic-javascript
      policy: default
    pattern-either:
      - pattern: eval(...)
      - pattern: Function(...)
      - pattern: new Function(...)

  - id: ai-toolkit-no-child-process-exec
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: Avoid child_process.exec with command strings; use an argument-safe API
    metadata:
      category: security
      technology:
        - javascript
        - typescript
      confidence: HIGH
      scope: generic-javascript
      policy: default
    pattern-either:
      - pattern: child_process.exec(...)

  - id: ai-toolkit-no-inner-html-assignment
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: Avoid assigning untrusted content to innerHTML
    metadata:
      category: security
      technology:
        - javascript
        - typescript
      confidence: HIGH
      scope: generic-javascript
      policy: default
    pattern: $ELEMENT.innerHTML = $VALUE
